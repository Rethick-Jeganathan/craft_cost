image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Web build
          image: node:20
          caches:
            - node
          script:
            - cd apps/web
            - npm ci || npm install
            - npm run build
      - step:
          name: API deps check
          image: python:3.11
          caches:
            - pip
          script:
            - python -V
            - python -m pip install --upgrade pip
            - python -m pip install -r apps/api/requirements.txt
            - python -c "import fastapi, sqlalchemy, alembic, redis; print('API deps OK')"
  default:
    - step:
        name: Web build
        image: node:20
        caches:
          - node
        script:
          - cd apps/web
          - npm ci || npm install
          - npm run build
    - step:
        name: API deps check
        image: python:3.11
        caches:
          - pip
        script:
          - python -V
          - python -m pip install --upgrade pip
          - python -m pip install -r apps/api/requirements.txt
          - python -c "import fastapi, sqlalchemy, alembic, redis; print('API deps OK')"
definitions:
  caches:
    pip: ~/.cache/pip
